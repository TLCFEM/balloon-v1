jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Python
        run: |
          pip install -r requirements.txt
      - name: Compile
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            mkdir tmp
            latexmk -pdf BALLOON.tex
          scheme: full
      - if: github.event_name == 'push'
        name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: BALLOON.pdf
          file: BALLOON.pdf
          overwrite: true
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: latest
name: PDF
'on':
  - push
  - pull_request

